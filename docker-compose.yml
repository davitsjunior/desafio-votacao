version: "3.9"

services:

  postgres:

    image: postgres:17

    container_name: desafio-votacao-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: desafio_votacao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d desafio_votacao"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: desafio-votacao-app

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:

  postgres_data: